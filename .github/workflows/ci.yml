name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build
        run: npm run build

      - name: Test OpenAlex provider fixture
        run: npm run test:openalex

      - name: Test Crossref provider fixture
        run: npm run test:crossref

      - name: Test recommendation semantics
        run: npm run test:recommendation

      - name: Test Inbox recommendation ordering
        run: npm run test:inbox-ordering

      - name: Initialize local D1
        run: npm run db:setup:local

      - name: Smoke-check seeded D1
        run: npm run db:smoke:local

      - name: Smoke-check Worker persistence API
        run: npm run api:smoke:local

      - name: Smoke-check feedback event API
        run: npm run api:smoke:feedback

      - name: Smoke-check recommendation rebuild API
        run: npm run api:smoke:recommendation

      - name: Smoke-check fixture-backed ingestion API
        run: npm run api:smoke:ingestion

      - name: Smoke-check Feed lifecycle and checkpoint semantics
        run: npm run api:smoke:feed-lifecycle

      - name: Smoke-check multi-Feed lifecycle invariants
        run: npm run api:smoke:multifeed
